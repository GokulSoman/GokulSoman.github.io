<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificates - Gokul Soman</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6fa;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 2rem;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      color: #2c3e50;
      border-bottom: 3px solid #1abc9c;
      padding-bottom: 0.5rem;
    }
    .cert-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }
    .cert-card {
      background: #f9f9f9;
      padding: 1rem;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.2s;
    }
    .cert-card:hover {
      transform: scale(1.03);
    }
    .cert-card img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
    }
    .cert-card h3 {
      margin: 0.8rem 0 0.4rem;
      color: #1abc9c;
    }
    .cert-card p {
      font-size: 0.9rem;
      color: #555;
    }
    .back-link {
      display: inline-block;
      margin-top: 1rem;
      text-decoration: none;
      color: #1abc9c;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Certificates</h1>
    <p>Here are some of my certifications:</p>

    <div class="cert-grid">
      <div class="cert-card">
        <img src="cert1.jpg" alt="Certificate 1">
        <h3>Python for Everybody</h3>
        <p>University of Michigan · Coursera</p>
      </div>
      <div class="cert-card">
        <img src="https://udemy-certificate.s3.amazonaws.com/image/UC-51b753dd-7dc9-421c-ba24-9c9a1da38fd2.jpg?v=1729244591000" alt="The Complete SQL Bootcamp: Go from Zero to Hero">
        <h3>The Complete SQL Bootcamp: Go from Zero to Hero</h3>
        <p>Jose Portilla, Pierian Training · Udemy</p>
      </div>
      <div class="cert-card">
        <img src="cert3.jpg" alt="Certificate 3">
        <h3>AWS Cloud Practitioner</h3>
        <p>Amazon Web Services</p>
      </div>
    </div>

    <a href="index.html" class="back-link">⬅ Back to Resume</a>
  </div>
</body>
</html>
